<!DOCTYPE html>
<html>

<head>
  <style>
    #input-div {
      padding: 3px;
    }

    input:focus-visible {
      outline: 2px solid green;
    }

    div:focus-within {
      outline: 2px solid blue;
    }
  </style>
</head>

<body>
  <h1>Focus Example</h1>
  <div id="input-div"> 
    <input />
  </div>
</body>

</html>
